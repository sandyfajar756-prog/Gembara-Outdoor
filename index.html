<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gembara Outdoor - Rental</title>

<style>
:root {
    --hijau: #215E61;
    --orange: #FF9E20;
    --putih: #ffffff;
    --abu: #f4f6f6;
    --text: #263839;
    --border: #dce4e4;
    --merah: #d64545;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--abu);
    color: var(--text);
}

/* ================= HEADER ================= */

header {
    background: var(--hijau);
    color: white;
    padding: 14px 18px;
}

.header-container {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 55px;
    height: 55px;
    background: white;
    border-radius: 10px;
    padding: 4px;
    object-fit: contain;
}

.logo-text h1 {
    margin: 0;
    font-size: 21px;
}

.logo-text p {
    margin: 4px 0 0;
    font-size: 12px;
    opacity: .85;
}

/* ================= NAVIGASI ================= */

nav {
    background: white;
    border-bottom: 1px solid var(--border);
}

.nav-container {
    max-width: 1100px;
    margin: auto;
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding: 8px 12px;
}

.nav-btn {
    border: none;
    background: transparent;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 14px;
}

.nav-btn:hover {
    background: #eef4f3;
}

.nav-btn.active {
    background: var(--hijau);
    color: white;
}

/* ================= MAIN ================= */

main {
    max-width: 1100px;
    margin: auto;
    padding: 18px 12px 50px;
}

.card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 17px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

h2 {
    margin: 0 0 6px;
}

h3 {
    margin: 0 0 8px;
}

.subtext {
    color: #718080;
    font-size: 13px;
}

/* ================= DASHBOARD ================= */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 16px;
}

.stat-title {
    font-size: 13px;
    color: #718080;
}

.stat-number {
    display: block;
    margin-top: 7px;
    color: var(--hijau);
    font-size: 25px;
    font-weight: bold;
}

/* ================= BUTTON ================= */

.btn {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: var(--hijau);
    color: white;
}

.btn-orange {
    background: var(--orange);
    color: white;
}

.btn-danger {
    background: var(--merah);
    color: white;
}

.btn:hover {
    opacity: .9;
}

/* ================= TABLE ================= */

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-size: 13px;
}

th {
    background: #f0f5f4;
}

.empty {
    text-align: center;
    color: #718080;
    padding: 25px;
}

/* ================= FORM ================= */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

input,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: white;
}

input:focus,
select:focus {
    border-color: var(--hijau);
}

/* ================= BADGE ================= */

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.badge-ready {
    background: #e4f2ee;
    color: var(--hijau);
}

.badge-rented {
    background: #fff0d8;
    color: #a76500;
}

.badge-maintenance {
    background: #ffe1e1;
    color: #b52e2e;
}

/* ================= NOTICE ================= */

.notice {
    background: #fff7e8;
    border-left: 4px solid var(--orange);
    padding: 11px;
    border-radius: 6px;
    font-size: 13px;
    margin: 12px 0;
}

/* ================= MODAL ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-content {
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 14px;
    padding: 18px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.close-btn {
    border: none;
    background: #eee;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    cursor: pointer;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 800px) {

    .dashboard-grid {
        grid-template-columns: 1fr 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }
}

@media (max-width: 500px) {

    .dashboard-grid {
        grid-template-columns: 1fr 1fr;
    }

    .logo {
        width: 48px;
        height: 48px;
    }

    .logo-text h1 {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="header-container">

        <!--
        LOGO GEMBARA

        Upload logo kamu ke repository GitHub
        dengan nama:

        logo-gembara.png

        Letakkan sejajar dengan index.html
        -->

        <img
            src="logo-gembara.png"
            class="logo"
            alt="Logo Gembara Outdoor"
        >

        <div class="logo-text">

            <h1>GEMBARA OUTDOOR</h1>

            <p>
                Rental Perlengkapan Outdoor
            </p>

        </div>

    </div>

</header>


<!-- ================= NAVIGASI ================= -->

<nav>

    <div class="nav-container">

        <button
            class="nav-btn active"
            onclick="showPage('dashboard', this)"
        >
            🏠 Dashboard
        </button>

        <button
            class="nav-btn"
            onclick="showPage('inventaris', this)"
        >
            📦 Inventaris
        </button>

        <button
            class="nav-btn"
            onclick="showPage('transaksi', this)"
        >
            🧾 Transaksi
        </button>

        <button
            class="nav-btn"
            onclick="showPage('pengembalian', this)"
        >
            ↩️ Pengembalian
        </button>

        <button
            class="nav-btn"
            onclick="showPage('pelanggan', this)"
        >
            👤 Pelanggan
        </button>

    </div>

</nav>


<!-- ================= AREA APLIKASI ================= -->

<main id="app">

</main>


<!-- ================= MODAL ================= -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h3 id="modalTitle">
                Form
            </h3>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div id="modalBody">

        </div>

    </div>

</div>


<script>

/* =====================================================
   DATABASE OFFLINE GEMBARA
===================================================== */

const STORAGE_KEY = "GEMBARA_OUTDOOR_V6";

let DB =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    )
    ||
    {
        barang: [],
        pelanggan: [],
        transaksi: []
    };

/* =====================================================
   SIMPAN DATABASE
===================================================== */

function saveDatabase() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(DB)
    );

}


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function rupiah(number) {

    return "Rp " +
        Number(number || 0)
        .toLocaleString("id-ID");

}


/* =====================================================
   ESCAPE TEXT
===================================================== */

function escapeHTML(text) {

    return String(text ?? "")
        .replace(/[&<>"']/g, function(char) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[char];

        });

}


/* =====================================================
   NOMOR ID
===================================================== */

function generateID(prefix) {

    return prefix +
        "-" +
        Date.now()
        .toString()
        .slice(-8);

}


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function today() {

    return new Date()
        .toISOString()
        .slice(0, 10);

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatDate(date) {

    if (!date) return "-";

    const d =
        new Date(date + "T00:00:00");

    return d.toLocaleDateString(
        "id-ID",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* =====================================================
   TAMBAH HARI
===================================================== */

function addDays(date, days) {

    const d =
        new Date(date + "T00:00:00");

    d.setDate(
        d.getDate() + Number(days)
    );

    return d
        .toISOString()
        .slice(0, 10);

}


/* =====================================================
   PINDAH HALAMAN
===================================================== */

function showPage(page, button) {

    document
        .querySelectorAll(".nav-btn")
        .forEach(function(btn) {

            btn.classList.remove("active");

        });


    if (button) {

        button.classList.add("active");

    }


    if (page === "dashboard") {

        dashboardPage();

    }

    else if (page === "inventaris") {

        inventarisPage();

    }

    else if (page === "transaksi") {

        transaksiPage();

    }

    else if (page === "pengembalian") {

        pengembalianPage();

    }

    else if (page === "pelanggan") {

        pelangganPage();

    }

}


/* =====================================================
   DASHBOARD
===================================================== */

function dashboardPage() {

    const totalUnit =
        DB.barang.reduce(
            function(total, barang) {

                return total +
                    Number(barang.stok || 0);

            },
            0
        );


    const sedangDisewa =
        DB.barang.reduce(
            function(total, barang) {

                return total +
                    Number(barang.disewa || 0);

            },
            0
        );


    const tersedia =
        totalUnit -
        sedangDisewa;


    const omzet =
        DB.transaksi.reduce(
            function(total, transaksi) {

                return total +
                    Number(transaksi.total || 0);

            },
            0
        );


    document.getElementById("app").innerHTML = `

        <div class="card">

            <h2>
                Dashboard Gembara Outdoor
            </h2>

            <div class="subtext">

                Ringkasan usaha rental kamu.

            </div>

        </div>


        <div class="dashboard-grid">


            <div class="stat-card">

                <div class="stat-title">
                    📦 Total Unit
                </div>

                <span class="stat-number">
                    ${totalUnit}
                </span>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    🟢 Barang Tersedia
                </div>

                <span class="stat-number">
                    ${tersedia}
                </span>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    🟠 Sedang Disewa
                </div>

                <span class="stat-number">
                    ${sedangDisewa}
                </span>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    💰 Total Omzet
                </div>

                <span
                    class="stat-number"
                    style="font-size:18px"
                >
                    ${rupiah(omzet)}
                </span>

            </div>


        </div>


        <div class="card">

            <h3>
                ⚡ Menu Cepat
            </h3>

            <br>

            <button
                class="btn btn-primary"
                onclick="showPage('transaksi')"
            >
                + Transaksi Baru
            </button>


            <button
                class="btn btn-orange"
                onclick="showPage('inventaris')"
            >
                + Tambah Barang
            </button>


            <button
                class="btn btn-primary"
                onclick="showPage('pengembalian')"
            >
                ↩️ Pengembalian
            </button>

        </div>


        <div class="card">

            <h3>
                🧾 Transaksi Terakhir
            </h3>

            ${
                DB.transaksi.length

                ?

                DB.transaksi
                .slice(-5)
                .reverse()
                .map(function(t) {

                    return `

                    <div
                        style="
                        padding:10px 0;
                        border-bottom:1px solid var(--border);
                        "
                    >

                        <b>
                            ${escapeHTML(t.nomor)}
                        </b>

                        -

                        ${escapeHTML(t.pelanggan)}

                        -

                        <b>
                            ${rupiah(t.total)}
                        </b>

                        <br>

                        <span class="subtext">

                            ${formatDate(t.mulai)}
                            s/d
                            ${formatDate(t.kembali)}

                            ·

                            ${escapeHTML(t.pembayaran)}

                        </span>

                    </div>

                    `;

                })
                .join("")

                :

                `
                <div class="empty">

                    Belum ada transaksi.

                </div>
                `

            }

        </div>

    `;

}


/* =====================================================
   INVENTARIS
===================================================== */

function inventarisPage() {

    document.getElementById("app").innerHTML = `

        <div class="card">

            <h2>
                📦 Inventaris Barang
            </h2>

            <div class="subtext">

                Data inventaris masih kosong.
                Kamu isi sendiri barang Gembara.

            </div>

            <br>

            <button
                class="btn btn-primary"
                onclick="openTambahBarang()"
            >
                + Tambah Barang
            </button>

        </div>


        <div class="card">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Kode
                            </th>

                            <th>
                                Nama
                            </th>

                            <th>
                                Kategori
                            </th>

                            <th>
                                Brand
                            </th>

                            <th>
                                Harga Sewa/Hari
                            </th>

                            <th>
                                Stok
                            </th>

                            <th>
                                Tersedia
                            </th>

                            <th>
                                Kondisi
                            </th>

                            <th>
                                Aksi
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${
                            DB.barang.length

                            ?

                            DB.barang
                            .map(function(barang, index) {

                                const tersedia =
                                    Number(barang.stok || 0)
                                    -
                                    Number(barang.disewa || 0);


                                let badge =
                                    "badge-ready";


                                if (
                                    barang.kondisi
                                    === "Maintenance"
                                ) {

                                    badge =
                                        "badge-maintenance";

                                }

                                else if (
                                    tersedia <= 0
                                ) {

                                    badge =
                                        "badge-rented";

                                }


                                return `

                                <tr>

                                    <td>

                                        <b>
                                            ${escapeHTML(barang.kode)}
                                        </b>

                                    </td>


                                    <td>

                                        ${escapeHTML(barang.nama)}

                                    </td>


                                    <td>

                                        ${escapeHTML(barang.kategori)}

                                    </td>


                                    <td>

                                        ${escapeHTML(barang.brand || "-")}

                                    </td>


                                    <td>

                                        ${rupiah(barang.harga)}

                                    </td>


                                    <td>

                                        ${barang.stok}

                                    </td>


                                    <td>

                                        <span
                                            class="badge ${badge}"
                                        >

                                            ${tersedia}

                                        </span>

                                    </td>


                                    <td>

                                        ${escapeHTML(barang.kondisi)}

                                    </td>


                                    <td>

                                      <div style="display:flex;gap:5px;">

    <button
        class="btn btn-primary"
        style="
        padding:7px 9px;
        font-size:12px;
        "
        onclick="editBarang(${index})"
    >
        Edit
    </button>

    <button
        class="btn btn-danger"
        style="
        padding:7px 9px;
        font-size:12px;
        "
        onclick="hapusBarang(${index})"
    >
        Hapus
    </button>

</div>

                                    </td>

                                </tr>

                                `;

                            })
                            .join("")

                            :

                            `

                            <tr>

                                <td
                                    colspan="9"
                                    class="empty"
                                >

                                    📦 Inventaris masih kosong.

                                    <br><br>

                                    Klik
                                    <b>+ Tambah Barang</b>
                                    untuk mulai memasukkan alat.

                                </td>

                            </tr>

                            `

                        }

                    </tbody>

                </table>

            </div>

        </div>

    `;

}


/* =====================================================
   MODAL TAMBAH BARANG
===================================================== */

function openTambahBarang() {

    document.getElementById("modalTitle")
        .textContent =
        "Tambah Barang Inventaris";


    document.getElementById("modalBody")
        .innerHTML = `

        <div class="notice">

            💡 Contoh kode:
            <b>GO-T001</b> untuk tenda,
            <b>GO-C001</b> untuk carrier.

        </div>


        <div class="form-group">

            <label>
                Kode Barang
            </label>

            <input
                id="kodeBarang"
                placeholder="Contoh GO-T001"
            >

        </div>


        <div class="form-group">

            <label>
                Nama Barang
            </label>

            <input
                id="namaBarang"
                placeholder="Contoh Tenda 2 Orang"
            >

        </div>


        <div class="form-group">

            <label>
                Kategori
            </label>

            <select id="kategoriBarang">

                <option>
                    Tenda
                </option>

                <option>
                    Carrier
                </option>

                <option>
                    Hydropack
                </option>

                <option>
                    Kompor
                </option>

                <option>
                    Sepatu
                </option>

                <option>
                    Jaket
                </option>

                <option>
                    Tracking Pole
                </option>

                <option>
                    Lainnya
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Brand
            </label>

            <input
                id="brandBarang"
                placeholder="Contoh Consina"
            >

        </div>


        <div class="form-group">

            <label>
                Harga Sewa / Hari
            </label>

            <input
                id="hargaBarang"
                type="number"
                min="0"
                placeholder="25000"
            >

        </div>


        <div class="form-group">

            <label>
                Jumlah Stok
            </label>

            <input
                id="stokBarang"
                type="number"
                min="0"
                value="0"
            >

        </div>


        <div class="form-group">

            <label>
                Kondisi
            </label>

            <select id="kondisiBarang">

                <option>
                    Baik
                </option>

                <option>
                    Perlu Dicek
                </option>

                <option>
                    Maintenance
                </option>

            </select>

        </div>


        <button
            class="btn btn-primary"
            onclick="simpanBarang()"
        >

            💾 Simpan Barang

        </button>

        `;


    openModal();

}


/* =====================================================
   SIMPAN BARANG
===================================================== */

function simpanBarang() {

    const kode =
        document
        .getElementById("kodeBarang")
        .value
        .trim();


    const nama =
        document
        .getElementById("namaBarang")
        .value
        .trim();


    const kategori =
        document
        .getElementById("kategoriBarang")
        .value;


    const brand =
        document
        .getElementById("brandBarang")
        .value
        .trim();


    const harga =
        Number(
            document
            .getElementById("hargaBarang")
            .value || 0
        );


    const stok =
        Number(
            document
            .getElementById("stokBarang")
            .value || 0
        );


    const kondisi =
        document
        .getElementById("kondisiBarang")
        .value;


    if (!kode || !nama) {

        alert(
            "Kode dan nama barang wajib diisi."
        );

        return;

    }


    const kodeSudahAda =
        DB.barang.some(function(barang) {

            return barang.kode.toLowerCase()
                === kode.toLowerCase();

        });


    if (kodeSudahAda) {

        alert(
            "Kode barang tersebut sudah digunakan."
        );

        return;

    }


    DB.barang.push({

        kode: kode,

        nama: nama,

        kategori: kategori,

        brand: brand,

        harga: harga,

        stok: stok,

        disewa: 0,

        kondisi: kondisi

    });


    saveDatabase();

    closeModal();

    inventarisPage();

}


/* =====================================================
   HAPUS BARANG
===================================================== */

function hapusBarang(index) {

    const barang =
        DB.barang[index];


    if (
        Number(barang.disewa || 0) > 0
    ) {

        alert(
            "Barang sedang disewa dan belum bisa dihapus."
        );

        return;

    }


    const yakin =
        confirm(
            "Hapus " +
            barang.nama +
            " dari inventaris?"
        );


    if (!yakin) return;


    DB.barang.splice(index, 1);

    saveDatabase();

    inventarisPage();

}


/* =====================================================
   MODAL
===================================================== */

function openModal() {

    document
        .getElementById("modal")
        .style.display =
        "flex";

}


function closeModal() {

    document
        .getElementById("modal")
        .style.display =
        "none";

}

/* =====================================================
   TRANSAKSI RENTAL - MULTI BARANG
===================================================== */

let keranjangRental = [];


/* ================================
   HALAMAN TRANSAKSI
================================ */

function transaksiPage() {

    keranjangRental = [];

    document.getElementById("app").innerHTML = `

        <div class="card">

            <h2>🧾 Transaksi Rental Baru</h2>

            <div class="subtext">

        </div>


        <div class="card">

                <div class="form-group">

                    <label>No. HP</label>

                <div class="form-group full">

            </div>

        <div class="card">

            <h3>📅 Waktu Sewa</h3>

                        <option value="4">

                        </option>

                        </option>

                        <option value="6">

                        </option>

                        <option value="7">

                        </option>

                        <option value="14">

                                    -

/* ================================
   HITUNG TANGGAL KEMBALI
================================ */

function hitungTanggalKembali() {

    const mulai =
        document.getElementById("trxMulai");

    const lama =
        document.getElementById("trxLama");

    const kembali =
        document.getElementById("trxKembali");


    if (!mulai || !lama || !kembali) {

        return;

    }


    kembali.value =
        formatDate(
            addDays(
                mulai.value,
                lama.value
            )
        );

}


/* ================================
   TAMBAH BARANG
================================ */

function tambahBarangRental() {

    const barangIndex =
        document.getElementById("trxBarang").value;


    const qty =
        Number(
            document.getElementById("trxQty").value
        );


    if (barangIndex === "") {

        alert(
            "Pilih barang terlebih dahulu."
        );

        return;

    }


    if (qty < 1) {

        alert(
            "Jumlah barang minimal 1."
        );

        return;

    }


    const barang =
        DB.barang[Number(barangIndex)];


    const tersedia =
        Number(barang.stok || 0)
        -
        Number(barang.disewa || 0);


    if (qty > tersedia) {

        alert(
            "Stok tidak cukup. Tersedia: "
            + tersedia
        );

        return;

    }


    const sudahAda =
        keranjangRental.find(
            function(item) {

                return item.index === Number(
                    barangIndex
                );

            }
        );


    if (sudahAda) {

        const jumlahBaru =
            sudahAda.qty + qty;


        if (jumlahBaru > tersedia) {

            alert(
                "Jumlah melebihi stok tersedia."
            );

            return;

        }


        sudahAda.qty =
            jumlahBaru;

    }

    else {

        keranjangRental.push({

            index:
                Number(barangIndex),

            qty:
                qty

        });

    }


    tampilkanKeranjang();

}


/* ================================
   TAMPILKAN KERANJANG
================================ */

function tampilkanKeranjang() {

    const container =
        document.getElementById(
            "keranjangContainer"
        );


    if (!container) return;


    const lamaElement =
        document.getElementById(
            "trxLama"
        );


    const lama =
        lamaElement
        ?
        Number(lamaElement.value)
        :
        1;


    if (keranjangRental.length === 0) {

        container.innerHTML = `

            <div class="empty">

                📦 Belum ada barang dipilih.

            </div>

        `;


        updateTotal();

        return;

    }


    let total =
        0;


    let html = `

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Barang
                        </th>

                        <th>
                            Qty
                        </th>

                        <th>
                            Harga/Hari
                        </th>

                        <th>
                            Subtotal
                        </th>

                        <th>
                            Aksi
                        </th>

                    </tr>

                </thead>

                <tbody>

    `;


    keranjangRental.forEach(
        function(item, posisi) {

            const barang =
                DB.barang[item.index];


            const subtotal =
                Number(barang.harga || 0)
                *
                item.qty
                *
                lama;


            total += subtotal;


            html += `

                <tr>

                    <td>

                        <b>
                            ${escapeHTML(barang.nama)}
                        </b>

                    </td>


                    <td>

                        ${item.qty}

                    </td>


                    <td>

                        ${rupiah(barang.harga)}

                    </td>


                    <td>

                        <b>
                            ${rupiah(subtotal)}
                        </b>

                    </td>


                    <td>

                        <button
                            class="btn btn-danger"
                            style="
                            padding:6px 9px;
                            font-size:11px;
                            "
                            onclick="hapusDariKeranjang(${posisi})"
                        >

                            Hapus

                        </button>

                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    container.innerHTML =
        html;


    const totalElement =
        document.getElementById(
            "totalTransaksi"
        );


    if (totalElement) {

        totalElement.innerHTML =
            "Total: " +
            rupiah(total);

    }

}


/* ================================
   HAPUS KERANJANG
================================ */

function hapusDariKeranjang(index) {

    keranjangRental.splice(
        index,
        1
    );


    tampilkanKeranjang();

}


/* ================================
   UPDATE TOTAL
================================ */

function updateTotal() {

    const lamaElement =
        document.getElementById(
            "trxLama"
        );


    const lama =
        lamaElement
        ?
        Number(lamaElement.value)
        :
        1;


    let total =
        0;


    keranjangRental.forEach(
        function(item) {

            const barang =
                DB.barang[item.index];


            total +=
                Number(barang.harga || 0)
                *
                item.qty
                *
                lama;

        }
    );


    const totalElement =
        document.getElementById(
            "totalTransaksi"
        );


    if (totalElement) {

        totalElement.innerHTML =
            "Total: " +
            rupiah(total);

    }

}


/* ================================
   SIMPAN TRANSAKSI
================================ */

function simpanTransaksiRental() {

    const pelanggan =
        document.getElementById(
            "trxPelanggan"
        ).value.trim();


    const hp =
        document.getElementById(
            "trxHP"
        ).value.trim();


    const keterangan =
        document.getElementById(
            "trxKeterangan"
        ).value.trim();


    const mulai =
        document.getElementById(
            "trxMulai"
        ).value;


    const lama =
        Number(
            document.getElementById(
                "trxLama"
            ).value
        );


    const pembayaran =
        document.getElementById(
            "trxPembayaran"
        ).value;


    const kembali =
        addDays(
            mulai,
            lama
        );


    if (!pelanggan) {

        alert(
            "Nama pelanggan wajib diisi."
        );

        return;

    }


    if (keranjangRental.length === 0) {

        alert(
            "Tambahkan minimal satu barang."
        );

        return;

    }


    /* ================================
       HITUNG TOTAL
    ================================= */

    let total =
        0;


    const daftarBarang =
        keranjangRental.map(
            function(item) {

                const barang =
                    DB.barang[item.index];


                const subtotal =
                    Number(barang.harga || 0)
                    *
                    item.qty
                    *
                    lama;


                total += subtotal;


                return {

                    kode:
                        barang.kode,

                    nama:
                        barang.nama,

                    harga:
                        Number(barang.harga || 0),

                    qty:
                        item.qty,

                    subtotal:
                        subtotal

                };

            }
        );


    /* ================================
       UPDATE STOK DISEWA
    ================================= */

    keranjangRental.forEach(
        function(item) {

            DB.barang[item.index].disewa =
                Number(
                    DB.barang[item.index].disewa || 0
                )
                +
                item.qty;

        }
    );


    /* ================================
       BUAT NOMOR TRANSAKSI
    ================================= */

    const nomor =
        "GO-" +
        new Date()
        .toISOString()
        .replace(/\D/g, "")
        .slice(0, 14);


    const transaksi = {

        nomor:
            nomor,

        pelanggan:
            pelanggan,

        hp:
            hp,

        keterangan:
            keterangan,

        mulai:
            mulai,

        lama:
            lama,

        kembali:
            kembali,

        pembayaran:
            pembayaran,

        total:
            total,

        status:
            "Disewa",

        barang:
            daftarBarang,

        dibuat:
            new Date().toISOString()

    };


    DB.transaksi.push(
        transaksi
    );


    /* ================================
       SIMPAN
    ================================= */

    saveDatabase();


    /* ================================
       SIMPAN DATA PELANGGAN
    ================================= */

    const pelangganAda =
        DB.pelanggan.some(
            function(p) {

                return p.nama.toLowerCase()
                    === pelanggan.toLowerCase();

            }
        );


    if (!pelangganAda) {

        DB.pelanggan.push({

            nama:
                pelanggan,

            hp:
                hp,

            keterangan:
                keterangan

        });

    }


    saveDatabase();


    alert(
        "Transaksi berhasil disimpan!\n\n"
        +
        "Nomor: "
        + nomor
        +
        "\nTotal: "
        + rupiah(total)
        +
        "\nKembali: "
        + formatDate(kembali)
    );


    /* ================================
       CETAK NOTA
    ================================= */

    cetakNota(transaksi);


    keranjangRental = [];

    dashboardPage();

}
